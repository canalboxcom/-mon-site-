<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Avenir Capital</title>
    <style>
        :root{
            --bg:#f8f9fa;
            --card:#ffffff;
            --tx:#1a1a1a;
            --mu:#6b7280;
            --pr:#5541e0;
            --pr2:#e9e5ff;
            --bd:#e5e7eb;
            --wa:#00b4eb;
            --er:#dc2626;
            box-sizing:border-box;
            padding-top:env(safe-area-inset-top,0px);
        }
        *{box-sizing:border-box;margin:0;padding:0}
        body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,sans-serif;padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
        #app{max-width:480px;margin:auto;padding:16px;padding-top:env(safe-area-inset-top,16px)}
        h1,h2,h3{margin:0 0 12px;font-weight:600}
        h1{font-size:24px}h2{font-size:20px}
        .card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
        input,select{width:100%;padding:14px 12px;margin:8px 0 16px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;font-size:16px;outline:none}
        input:focus{border-color:var(--pr)}
        label{font-size:14px;color:var(--mu);font-weight:500}
        button{font:inherit;cursor:pointer;border:none;outline:none}
        .btn{width:100%;padding:15px;border-radius:12px;background:var(--pr);color:#fff;font-weight:600;font-size:16px;transition:opacity .2s}
        .btn:hover{opacity:.92}
        .btn.sec{background:var(--pr2);color:var(--pr)}
        .btn.out{background:transparent;border:1px solid var(--er);color:var(--er)}
        .mu{color:var(--mu);font-size:14px;line-height:1.5}
        .err{color:var(--er);font-size:14px;min-height:22px;margin-bottom:8px}
        .back{background:none;border:none;color:var(--pr);padding:0 0 12px;font-weight:600;font-size:16px;display:inline-block}
        nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -2px 10px rgba(0,0,0,.05)}
        nav button{flex:1;padding:10px 4px;background:none;color:var(--mu);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
        nav button.on{color:var(--pr);font-weight:600}
        nav span{font-size:22px}
        .num{font-size:26px;font-weight:700;letter-spacing:2px}
        .ref-box{background:var(--pr2);border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px;margin:12px 0}
        .ref-box input{flex:1;margin:0;border:none;background:transparent;color:var(--pr);font-weight:600;padding:0}
        .copy-btn{background:var(--pr);color:#fff;border:none;border-radius:8px;padding:10px 14px;font-size:14px;font-weight:600;white-space:nowrap}
        a{text-decoration:none;color:inherit}
        .loader-box{text-align:center;padding:60px 20px}
        .tag{font-size:12px;padding:4px 10px;border-radius:20px;background:#fef3c7;color:#92400e;font-weight:500}
        .tag.pr{background:var(--pr2);color:var(--pr)}
        .li{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px;margin-bottom:8px;border-radius:12px;background:var(--card);border:1px solid var(--bd)}
        .wave-border{border:2px solid var(--wa)}
        .disabled{opacity:.5;cursor:not-allowed}
        .chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
        .chips button{padding:8px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
        .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
        input::placeholder{color:#b0bec5}
    </style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,setDoc,onSnapshot,collection,addDoc,runTransaction,query,where} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
    apiKey:"AIzaSyC8jUCtIrHrySXzNAXTdRTaCBTNgEirS8w",
    authDomain:"avenir-capital.firebaseapp.com",
    projectId:"avenir-capital",
    storageBucket:"avenir-capital.firebasestorage.app",
    messagingSenderId:"565430762059",
    appId:"1:565430762059:web:3c7d536d55d3277d35ebce"
};

const SITE_URL="https://papoleriche61-ai.github.io/avenir/";
const WAVE_NUM="0171518903";
const SUPPORT="https://wa.me/message/ABZ2BRFJPVIOE1";
const VIP=[{n:"VIP1",p:5000,d:600},{n:"VIP2",p:10000,d:1500},{n:"VIP3",p:50000,d:3500},{n:"VIP4",p:100000,d:5000}];
const METH=["Wave","MTN Money","Moov Money","Orange Money"];

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const fs=getFirestore(app);

const em=p=>p.replace(/\D/g,"")+"@avenir.app";
let ud=null,recs=[],rets=[],buys=[],gains=[],unsubs=[],loading=true,P="signup",T={};
let codeAttendu="";
const me=new Proxy({},{get:(_,k)=>(ud||{})[k]});
const U=()=>ud&&{...ud,recs,rets,buys,gains};
const F=n=>Number(n||0).toLocaleString("fr-FR")+" F";
const D=()=>new Date().toLocaleDateString("fr-FR");
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id)?document.getElementById(id).value.trim():"";

window.copierLien = async function(){
    try {
        await navigator.clipboard.writeText(SITE_URL);
        alert("✅ Lien copié avec succès !");
    } catch (e) {
        const input = document.getElementById('site-link');
        if(input){input.select();document.execCommand('copy');}
        alert("✅ Lien copié avec succès !");
    }
};

window.partagerDirect = async function(){
    if(navigator.share){
        try {
            await navigator.share({
                title: "Avenir Capital",
                text: "Rejoignez Avenir Capital pour investir et gagner !",
                url: SITE_URL
            });
        } catch (e) {}
    } else {
        copierLien();
    }
};

window.copyN = function(){
    try{navigator.clipboard.writeText(WAVE_NUM)}catch(e){}
    const btn=document.getElementById("cp");
    if(btn)btn.textContent="Copié ✓";
};

window.go = function(p,t){P=p;if(t)Object.assign(T,t);render();scrollTo(0,0)};
function err(m){const e=document.getElementById("err");if(e)e.textContent=m}
window.err = err;

const msg=e=>({
    "auth/email-already-in-use":"Ce numéro est déjà inscrit.",
    "auth/invalid-credential":"Numéro ou mot de passe incorrect.",
    "auth/weak-password":"Mot de passe : 6 caractères minimum."
}[e.code]||("Erreur : "+(e.code||e.message)));

const back=(p="home")=>`<button class="back" onclick="go('${p}')">‹ Retour</button>`;
const hist=(a,empty)=>a.length?a.map(x=>`<div class="card"><div class="row"><div><b>${F(x.a)}</b><div class="mu">${x.m||"Wave"} · ${x.t||""}</div></div><span class="tag">${x.s||"En attente"}</span></div></div>`).join(""):`<p class="mu">${empty}</p>`;

window.envoyerCode = function(){
    const n = $("n"), p = $("ph");
    if(!n || n.length < 2) return err("Entrez votre nom complet.");
    if(p.length < 8) return err("Entrez un numéro valide.");
    codeAttendu = Math.floor(1000 + Math.random() * 9000).toString();
    alert(`📱 Code de vérification envoyé !\n\n👉 Votre code est : ${codeAttendu}`);
    document.getElementById("form-step1").style.display = "none";
    document.getElementById("form-step2").style.display = "block";
    err("");
};

window.verifierCode = async function(){
    const saisi = $("code");
    const n = $("n"), p = $("ph");
    if(saisi !== codeAttendu){
        const e2 = document.getElementById("err2");
        if(e2)e2.textContent = "❌ Code incorrect. Réessayez.";
        return;
    }
    const motDePasse = p;
    try {
        const c = await createUserWithEmailAndPassword(auth, em(p), motDePasse);
        await setDoc(doc(fs, "users", c.user.uid), {
            name: n, phone: p, bal: 0, card: null, ts: Date.now()
        });
    } catch(e) {
        const e2 = document.getElementById("err2");
        if(e2)e2.textContent = msg(e);
    }
};

window.retourEtape1 = function(){
    document.getElementById("form-step1").style.display = "block";
    document.getElementById("form-step2").style.display = "none";
    const cd = document.getElementById("code");if(cd)cd.value="";
    err("");
};

window.login = async function(){
    try {
        await signInWithEmailAndPassword(auth, em($("ph")), $("pw"));
    } catch(e) {
        err(msg(e));
    }
};

window.logout = function(){
    signOut(auth);
};

window.toMethod = function(){
    const a = +$("a");
    if(a < 1000) return err("Montant minimum : 1 000 F.");
    T.amt = a;
    go("method");
};

window.confirmPay = async function(){
    const p = $("pn"), t = $("tx");
    if(p.length < 8 || t.length < 4) return err("Entrez votre numéro et l'ID de transaction.");
    try {
        await addDoc(collection(fs, "recharges"), {
            uid: auth.currentUser.uid,
            a: T.amt,
            m: "Wave · " + esc(p) + " · ID " + esc(t),
            pn: p,
            tx: t,
            t: D(),
            ts: Date.now(),
            s: "En attente"
        });
        go("histRec");
        alert("✅ Demande enregistrée ! Le solde sera crédité après vérification.");
    } catch(e) {
        err(msg(e));
    }
};

window.doWd = async function(){
    const a = +$("a"), p = $("pn"), ref = doc(fs, "users", auth.currentUser.uid);
    if(a < 1000) return err("Montant minimum : 1 000 F.");
    if(p.length < 8) return err("Entrez un numéro valide.");
    try {
        await runTransaction(fs, async t => {
            const snap = await t.get(ref);
            const b = snap.exists() ? (snap.data().bal || 0) : 0;
            if(b < a) throw { message: "Solde insuffisant." };
            t.update(ref, { bal: b - a });
            const newWdRef = doc(collection(fs, "withdrawals"));
            t.set(newWdRef, {
                uid: auth.currentUser.uid,
                a: a,
                m: esc(p),
                pn: p,
                t: D(),
                ts: Date.now(),
                s: "En attente"
            });
        });
        go("histRet");
        alert("✅ Demande de retrait envoyée !");
    } catch(e) {
        err(e.message||"Erreur lors du retrait.");
    }
};

window.doLink = async function(){
    const p = $("pn");
    if(p.length < 8) return err("Entrez un numéro valide.");
    await setDoc(doc(fs, "users", auth.currentUser.uid), {
        card: { m: $("m"), num: p }
    }, { merge: true });
    go("card");
    alert("✅ Compte lié avec succès !");
};

window.buy = async function(i){
    const v = VIP[i], ref = doc(fs, "users", auth.currentUser.uid);
    try {
        await runTransaction(fs, async t => {
            const snap = await t.get(ref);
            const b = snap.exists() ? (snap.data().bal || 0) : 0;
            if(b < v.p) throw { message: "Solde insuffisant. Rechargez votre compte." };
            t.update(ref, { bal: b - v.p });
            const newBuyRef = doc(collection(fs, "purchases"));
            t.set(newBuyRef, {
                uid: auth.currentUser.uid,
                n: v.n,
                p: v.p,
                d: v.d,
                t: D(),
                ts: Date.now(),
                daysLeft: 31
            });
        });
        go("achats");
    } catch(e) {
        err(e.message||"Erreur lors de l'achat.");
    }
};

const pages={
    signup:()=>`<div style="text-align:center;padding:20px 0">
        <div style="background:linear-gradient(135deg,#5541e0,#6b5ce8);width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px">

        </div>

    <div class="card" id="form-step1">

        <div id="err" class="err"></div>

    <div class="card" id="form-step2" style="display:none">

            <h3>Code de vérification</h3>

        <div id="err2" class="err"></div>
        
        <button class="btn" onclick="verifierCode()">Confirmer</button>

    </div>
    
    <button class="btn sec" onclick="go('login')">J'ai déjà un compte</button>`,

    login:()=>`<div style="text-align:center;padding:20px 0">
        <div style="background:linear-gradient(135deg,#5541e0,#6b5ce8);width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px">
            <span style="font-size:36px">🔐</span>
        </div>
        <h1 style="margin:0">Connexion</h1>

    </div>
    <button class="btn sec" onclick="go('signup')">Créer un compte</button>`,

    home:()=>{
        const u=U();
        return `
        <div style="background:linear-gradient(180deg,#5541e0,#6b5ce8);margin:-16px -16px 0 -16px;padding:20px 16px 30px;border-radius:0 0 24px 24px">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
                <span style="font-size:24px">⚙️</span>
                <span style="background:rgba(255,255,255,0.2);padding:6px 12px;border-radius:20px;font-size:14px;color:#fff">📇 ${esc(u.phone||"")}</span>
            </div>
            <div style="font-size:42px;font-weight:700;color:#fff;margin:10px 0">${F(u.bal)}</div>

        <div style="background:linear-gradient(135deg,#34cfff,#00b4eb);border-radius:20px;padding:20px;text-align:center;margin:16px;margin-bottom:24px">

    },

    share:()=>`${back()}<h2 style="text-align:center;margin-bottom:20px">🔗 Partager l'application</h2>
    <div class="card">
        <p class="mu" style="text-align:center;margin-bottom:16px">Partagez Avenir Capital avec vos proches et gagnez ensemble !</p>
        
        <h3>🌐 Lien du site</h3>
        <div class="ref-box">

               target="_blank" rel="noopener" class="btn" style="background:#25d366;text-align:center">
                💬 WhatsApp

            <button class="btn sec" onclick="partagerDirect()">📤 Partager</button>

            <div class="mu">${esc(me.phone)}</div>
            <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--bd)">
                <span style="font-size:24px;font-weight:700;color:var(--pr)">${F(u.bal)}</span>
                <div class="mu">Solde disponible</div>
            </div>
        </div>`+[
            ["histRec","📥 Historique des recharges"],
            ["histRet","📤 Historique des retraits"],
            ["histGain","💰 Historique des gains"],
            ["achats","📈 Mes investissements"],
            ["share","🔗 Partager l'application"],
            ["link","🔗 Lier mon compte de retrait"],
            ["card","💳 Ma méthode de paiement"],
            ["service","💬 Service client"]
        ].map(x=>`<button class="li" onclick="go('${x[0]}')">${x[1]} <span>›</span></button>`).join("")+
        `<button class="btn out" style="margin-top:16px" onclick="logout()">Se déconnecter</button>`;
    },

    recharge:()=>`${back()}<h2>Recharger</h2><div class="card">
        <label>Montant (minimum 1 000 F)</label>
        <input id="a" type="number" inputmode="numeric" value="${T.amt||""}">
        <div class="chips">${[5000,10000,50000,100000].map(v=>`<button onclick="document.getElementById('a').value=${v}">${v.toLocaleString("fr-FR")}</button>`).join("")}</div>
        <div id="err" class="err"></div>
        <button class="btn" onclick="toMethod()">Confirmer</button>
    </div>`,

    method:()=>`${back("recharge")}<h2>Choisir la méthode</h2>
    <p class="mu">Montant : <b>${F(T.amt)}</b></p>`+METH.map(m=>m=="Wave"?
        `<button class="li wave-border" onclick="go('pay')"><b>Wave</b><span>›</span></button>`:
        `<button class="li disabled" onclick="err('${m} : indisponible pour le moment. Utilisez Wave.')"><b>${m}</b><span>Indisponible</span></button>`
    ).join("")+`<div id="err" class="err"></div>`,

    pay:()=>`${back("method")}<h2>Paiement Wave</h2>
    <div class="card wave-border">
        <p class="mu">Copiez le numéro et effectuez votre paiement de <b>${F(T.amt)}</b></p>
        <div class="row" style="margin-top:12px"><span class="num">${WAVE_NUM}</span>
        <button class="btn sec" style="width:auto;padding:10px 14px" onclick="copyN()" id="cp">Copier</button></div>
    </div>
    <div class="card">
        <label>Votre numéro de paiement</label><input id="pn" type="tel" placeholder="Ex: 0700000000">
        <label>ID de la transaction</label><input id="tx" placeholder="Reçu de paiement">
        <div id="err" class="err"></div>
        <button class="btn" onclick="confirmPay()">Confirmer le paiement</button>
    </div>`,

    histRec:()=>`${back("account")}<h2>Historique des recharges</h2>`+hist(U().recs,"Aucune recharge."),
    histRet:()=>`${back("account")}<h2>Historique des retraits</h2>`+hist(U().rets,"Aucun retrait."),
    histGain:()=>`${back("account")}<h2>Historique des gains</h2>`+(U().gains.length?U().gains.map(x=>`<div class="card"><div class="row"><div><b>+${F(x.a)}</b><div class="mu">Gain journalier · ${esc(x.t)}</div></div><span class="tag pr">Crédité</span></div></div>`).join(""):`<p class="mu">Aucun gain pour le moment.</p>`),

    withdraw:()=>{
        const c=U().card;
        return `${back()}<h2>Retirer</h2><div class="card">
            <p class="mu">Solde disponible : ${F(U().bal)}</p>
            <label>Montant (minimum 1 000 F)</label><input id="a" type="number" inputmode="numeric">
            <label>Votre numéro</label><input id="pn" type="tel" value="${c?esc(c.num):""}" placeholder="Ex: 0700000000">
            <div id="err" class="err"></div>
            <button class="btn" onclick="doWd()">Confirmer le retrait</button>
        </div>`;
    },

    link:()=>`${back("account")}<h2>Lier mon compte de retrait</h2><div class="card">
        <label>Méthode</label><select id="m">${METH.map(m=>`<option>${m}</option>`).join("")}</select>
        <label>Numéro</label><input id="pn" type="tel" placeholder="Ex: 0700000000">
        <div id="err" class="err"></div>
        <button class="btn" onclick="doLink()">Confirmer</button>
    </div>`,

    card:()=>{
        const c=U().card;
        return `${back("account")}<h2>Ma méthode de paiement</h2>`+
        (c?`<div class="card" style="text-align:center;background:linear-gradient(135deg,#5541e0,#6b5ce8);color:#fff">
            <small style="opacity:.8">${esc(c.m)}</small>
            <div style="font-size:28px;font-weight:700;margin:8px 0">${esc(c.num)}</div>
            <small>${esc(U().name)}</small>
        </div>`:`<p class="mu">Aucune méthode liée.</p><button class="btn" onclick="go('link')">Lier un compte</button>`);
    },

    service:()=>`${back("account")}<h2 style="text-align:center">Service client</h2><div class="card" style="text-align:center">
        <div style="font-size:50px;margin-bottom:16px">💬</div>
        <p class="mu">Une question ? Besoin d'aide ? Écrivez-nous directement sur WhatsApp.</p>
        <a class="btn" style="display:block;text-align:center;margin-top:16px;background:#25d366" href="${SUPPORT}" target="_blank" rel="noopener">Contacter sur WhatsApp</a>
        <p class="mu" style="margin-top:16px">Disponible tous les jours pour vous aider.</p>
    </div>`
};

function render(){
    const app=document.getElementById("app"),n=document.getElementById("nav");
    if(loading){
        app.innerHTML='<div class="loader-box"><h1>Avenir Capital</h1><p class="mu">Chargement en cours…</p></div>';
        n.style.display="none";
        return;
    }
    
    if(!U()){
        if(P !== "login" && P !== "signup") P = "signup";
    } else {
        if(P === "signup" || P === "login") P = "home";
    }

    app.innerHTML=pages[P]?pages[P]():pages["home"]();
    
    const tabs=[["home","🏠","Accueil"],["invest","📈","Investir"],["share","🔗","Partager"],["achats","🧾","Achats"],["account","👤","Compte"]];
    n.style.display=U()?"flex":"none";
    n.innerHTML=tabs.map(t=>`<button class="${t[0]==P?"on":""}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join("");
}

onAuthStateChanged(auth, user => {
    unsubs.forEach(u=>u());
    unsubs=[];
    recs = []; rets = []; buys = []; gains = [];
    
    if(user){
        unsubs.push(onSnapshot(doc(fs, "users", user.uid), snap => {
            ud = snap.exists() ? snap.data() : null;
            loading = false;
            render();
        }));

        const qRec = query(collection(fs, "recharges"), where("uid", "==", user.uid));
        unsubs.push(onSnapshot(qRec, snap => {
            recs = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b)=>(b.ts||0)-(a.ts||0));
            render();
        }));

        const qWd = query(collection(fs, "withdrawals"), where("uid", "==", user.uid));
        unsubs.push(onSnapshot(qWd, snap => {
            rets = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b)=>(b.ts||0)-(a.ts||0));
            render();
        }));

        const qBuy = query(collection(fs, "purchases"), where("uid", "==", user.uid));
        unsubs.push(onSnapshot(qBuy, snap => {
            buys = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b)=>(b.ts||0)-(a.ts||0));
            render();
        }));

        const qGain = query(collection(fs, "gains"), where("uid", "==", user.uid));
        unsubs.push(onSnapshot(qGain, snap => {
            gains = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b)=>(b.ts||0)-(a.ts||0));
            render();
        }));

    } else {
        ud = null;
        loading = false;
        render();
    }
});
</script>
</body>
</html>
